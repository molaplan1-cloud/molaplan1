; Molaplan Bridge firmware – one image for every supported ESP32 board (board profile chosen at onboarding).
[platformio]
default_envs = esp32

[common]
fw_version = 0.8.0
lib_deps_core =
  bblanchon/ArduinoJson @ ^7.2.1

[env:esp32]
platform = espressif32 @ 6.9.0
board = esp32dev
framework = arduino
board_build.partitions = partitions_ab.csv
board_build.flash_mode = dio
monitor_speed = 115200
build_unflags = -std=gnu++11
build_flags =
  -std=gnu++17
  -DMP_FW_VERSION=\"${common.fw_version}\"
  -DCORE_DEBUG_LEVEL=1
  -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
  -DWEBSOCKETS_NETWORK_TYPE=NETWORK_ESP32
lib_deps =
  ${common.lib_deps_core}
  links2004/WebSockets @ ^2.6.1
  knolleary/PubSubClient @ ^2.8
  crankyoldgit/IRremoteESP8266 @ ^2.8.6
  sui77/rc-switch @ ^2.6.4
  paulstoffregen/OneWire @ ^2.3.8
  milesburton/DallasTemperature @ ^3.11.0
  h2zero/NimBLE-Arduino @ ^1.4.2
  ricmoo/QRCode @ ^0.0.1

; Host-side unit tests for the protocol, crypto and request building (needs libmbedtls-dev).
[env:native]
platform = native
test_framework = unity
build_flags =
  -std=gnu++17
  -DMP_FW_VERSION=\"${common.fw_version}\"
  -lmbedcrypto
lib_deps =
  ${common.lib_deps_core}
lib_compat_mode = off

<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#5B4BFF">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cst[...]
<meta name="application-name" content="Molaplan">
<meta name="apple-mobile-web-app-title" content="Molaplan">
<meta name="description" content="Molaplan – löydä seuraa harrastuksiin (ja välillä johonkin ihan hulluun) omassa kaupungissasi. ¡Mola el plan!">
<meta property="og:title" content="Molaplan – ¡mola el plan!">
<meta property="og:description" content="Löydä seuraa harrastuksiin ja tapaa uusia ihmisiä omassa kaupungissasi.">
<title>Molaplan – löydä seuraa harrastuksiin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<script src="config.js"></script>
<script src="cities.js"></script>
<script src="i18n.js"></script>
<style>
:root{
  --bg:#F5F4FA; --card:#fff; --ink:#17152B; --ink2:#3A3654; --muted:#77728F; --line:#ECEAF4;
  --pri:#5B4BFF; --pri-d:#4436E0; --pink:#FF6A88; --ok:#12B886;
  --grad:linear-gradient(135deg,#5B4BFF 0%,#9A5BFF 52%,#FF6A88 100%);
  --r:22px; --shadow:0 10px 30px -12px rgba(43,32,120,.22),0 2px 8px -3px rgba(43,32,120,.08);
  --shadow-sm:0 4px 14px -6px rgba(43,32,120,.18);
  --nav-h:78px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);
  background:radial-gradient(circle at 15% 10%,#E4DEFF 0,transparent 45%),radial-gradient(circle at 85% 90%,#FFDDE6 0,transparent 45%),#EEEFF7;
  display:flex;align-items:center;justify-content:center;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
svg.i{width:1em;height:1em;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:-.12em}
[hidden]{display:none!important}
#app{position:relative;width:100%;max-width:500px;height:100dvh;background:var(--bg);overflow:hidden;overflow:clip;isolation:isolate}
</style>
</head>
<body>
<div class="desk-note" data-i18n="desk.note"></div>
<div id="app" class="onb">
  <section id="gate" class="screen active"></section>
  <section id="onb" class="screen"></section>

  <section id="s-home" class="screen tab"></section>
  <section id="s-map" class="screen tab">
    <div class="map-top" id="map-top">
      <div class="map-title"><div class="row" style="gap:4px"><h2 data-i18n="nav.map">Map</h2><button class="ftoggle" data-a="ftoggle" id="ftoggle"></button></div><span class="count-pill" id="map-count"></span></div>
      <div id="map-filters"></div>
    </div>
    <div id="bigmap"></div>
    <button class="fab-loc" data-a="locate"></button>
    <div id="map-vt"></div>
    <div class="map-card" id="map-card"></div>
    <div class="map-empty" id="map-empty" hidden><b data-i18n="map.emptyTitle"></b><span data-i18n="map.emptyBody"></span><button class="btn primary" data-a="tab" data-t="create" data-i18n="map.emptyBtn"></button></div>
  </section>
  <section id="s-create" class="screen tab"></section>
  <section id="s-chats" class="screen tab"></section>
  <section id="s-mine" class="screen tab"></section>
  <section id="s-profile" class="screen tab"></section>

  <section id="s-detail" class="screen push"></section>
  <section id="s-lajit" class="screen push"></section>
  <section id="s-hullut" class="screen push"></section>
  <section id="s-chat" class="screen push"></section>
  <section id="s-good" class="screen push"></section>
  <section id="s-hdetail" class="screen push"></section>
  <section id="s-ask" class="screen push"></section>
  <section id="s-admin" class="screen push"></section>
  <section id="s-biz" class="screen push"></section>
  <section id="s-teams" class="screen push"></section>
  <section id="s-team" class="screen push"></section>

  <nav id="nav"></nav>

  <div class="sheet-bg" data-a="sheet-close"></div>
  <div class="sheet" id="sheet"></div>
  <div id="toast"></div>
</div>
<script src="friend-requests.js"></script>
</body>
</html>

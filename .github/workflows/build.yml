name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.50.1'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Install and start Mosquitto
        run: |
          sudo apt-get update
          sudo apt-get install -y mosquitto
          printf 'listener 18883 127.0.0.1\nallow_anonymous true\npersistence false\n' | sudo tee /etc/mosquitto/ci-test.conf >/dev/null
          sudo mosquitto -c /etc/mosquitto/ci-test.conf -d
          for i in $(seq 1 50); do
            if bash -c 'echo >/dev/tcp/127.0.0.1/18883' 2>/dev/null; then
              exit 0
            fi
            sleep 0.1
          done
          echo "mosquitto did not listen on 18883" >&2
          exit 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Relay (wrangler dev) for the end-to-end test
        working-directory: relay
        run: npm ci && npx tsc --noEmit
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
        env:
          MQTT_TEST_PORT: '18883'

  # R215–R217: Supabase migrations + RLS tests on a throw-away Postgres (runner has PostgreSQL).
  rls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash tool/rls_test.sh

  shop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node --test web-site/shop-worker/test/*.test.mjs

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Zip portable build
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath molaplan-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: molaplan-windows-x64
          path: molaplan-windows-x64.zip

  android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Release signing key
        env:
          KEYSTORE_B64: ${{ secrets.MOLAPLAN_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/molaplan-release.jks"
            echo "MOLAPLAN_KEYSTORE=$RUNNER_TEMP/molaplan-release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::MOLAPLAN_KEYSTORE_B64 not set - APKs are debug-signed and in-app updates will not install over them"
          fi
      - run: flutter pub get
      - name: Build APKs (universal + per-ABI)
        env:
          MOLAPLAN_KEYSTORE_PASSWORD: ${{ secrets.MOLAPLAN_KEYSTORE_PASSWORD }}
        run: |
          mkdir -p dist
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk dist/molaplan-android-universal.apk
          flutter build apk --release --split-per-abi
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk dist/molaplan-android-arm64.apk
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: molaplan-android
          path: dist/*.apk

  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('firmware/molaplan-bridge/platformio.ini') }}
      - name: Tools (PlatformIO, host compiler + mbedTLS for the host tests)
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ libmbedtls-dev
          pip install 'platformio>=6.1,<7' cryptography
      - name: Host tests (protocol, crypto, request building, OTA signature)
        working-directory: firmware/molaplan-bridge
        run: pio test -e native
      - name: Build the ESP32 image
        working-directory: firmware/molaplan-bridge
        run: pio run -e esp32
      - name: Release assets (+ signed OTA manifest on tags)
        working-directory: firmware/molaplan-bridge
        env:
          BRIDGE_OTA_SIGNING_KEY: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.BRIDGE_OTA_SIGNING_KEY || '' }}
        run: |
          ver=$(sed -n 's/^fw_version *= *//p' platformio.ini)
          tools/make_release.sh "$ver" "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"
          if [[ "$GITHUB_REF" == refs/tags/v* && ! -f dist/molaplan-bridge-esp32.manifest.json ]]; then
            echo "::error::BRIDGE_OTA_SIGNING_KEY missing – a release needs the signed OTA manifest"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: molaplan-bridge
          path: firmware/molaplan-bridge/dist/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [rls, windows, android, firmware]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect assets with stable names + SHA256SUMS
        run: |
          mkdir -p dist
          cp artifacts/molaplan-android/molaplan-android-arm64.apk dist/
          cp artifacts/molaplan-android/molaplan-android-universal.apk dist/
          cp artifacts/molaplan-windows-x64/molaplan-windows-x64.zip dist/
          cp artifacts/molaplan-bridge/* dist/
          (cd dist && sha256sum molaplan-android-arm64.apk molaplan-android-universal.apk molaplan-windows-x64.zip molaplan-bridge-esp32*.bin molaplan-bridge-esp32.manifest.json > SHA256SUMS)
          cat dist/SHA256SUMS
          notes="docs/release-notes/${GITHUB_REF_NAME}.md"
          if [ -f "$notes" ]; then cp "$notes" release-notes.md; else echo "Molaplan ${GITHUB_REF_NAME}" > release-notes.md; fi
      - uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          files: |
            dist/molaplan-android-arm64.apk
            dist/molaplan-android-universal.apk
            dist/molaplan-windows-x64.zip
            dist/molaplan-bridge-esp32.bin
            dist/molaplan-bridge-esp32-factory.bin
            dist/molaplan-bridge-esp32.manifest.json
            dist/SHA256SUMS

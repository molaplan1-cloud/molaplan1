name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.50.1'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Install and start Mosquitto
        run: |
          sudo apt-get update
          sudo apt-get install -y mosquitto
          printf 'listener 18883 127.0.0.1\nallow_anonymous true\npersistence false\n' | sudo tee /etc/mosquitto/ci-test.conf >/dev/null
          sudo mosquitto -c /etc/mosquitto/ci-test.conf -d
          for i in $(seq 1 50); do
            if bash -c 'echo >/dev/tcp/127.0.0.1/18883' 2>/dev/null; then
              exit 0
            fi
            sleep 0.1
          done
          echo "mosquitto did not listen on 18883" >&2
          exit 1
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
        env:
          MQTT_TEST_PORT: '18883'

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Zip portable build
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath molaplan-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: molaplan-windows-x64
          path: molaplan-windows-x64.zip

  android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: molaplan-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            molaplan-windows-x64/molaplan-windows-x64.zip
            molaplan-android-apk/app-release.apk

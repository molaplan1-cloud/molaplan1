 S.user.name=$('#p-name').value.trim();S.user.city=c;S.user.customCity=cc;S.user.district=$('#p-district').value;S.user.bio=$('#p-bio').value.trim();save();
 if(oldCity!==cityName()||oldD!==S.user.district){F.district='all';resetCreate();if(bigMap){bigMap._fitted=false;selectMarker(null);renderMarkers(true)}}
 renderProfile();renderMapFilters();
 toast('Tiedot tallennettu ✓');
}

/* ================= EVENTS ================= */
document.addEventListener('click',e=>{
 const el=e.target.closest('[data-a]');if(!el)return;
 const a=el.dataset.a, id=el.dataset.id, v=el.dataset.v;
 switch(a){
  case 'tab':go(el.dataset.t);break;
  case 'open':openDetail(id);break;
  case 'back':goBack();break;
  case 'open-hullut':openHullut();break;
  case 'open-chat':openChat(id);break;
  case 'chat-detail':{const o=chatObj(id);if(o&&o.kind==='help')navTo('s-hdetail',id);else navTo('s-detail',id);break}
  case 'open-good':openGood();break;
  case 'good-map':goodMap();break;
  case 'gf-cat':GF.cat=v;renderGood();break;
  case 'ask-help':openAsk();break;
  case 'open-help':openHelp(id);break;
  case 'offer':offerHelp(id);break;
  case 'unoffer':unofferHelp(id);break;
  case 'a-cat':A.cat=v;if(v!=='kuljetus'){A.dest=null;A.pinMode='from'}renderAsk();break;
  case 'a-pinmode':A.pinMode=v;renderAsk();break;
  case 'a-dur':A.dur=v;$$('.dur-pick button').forEach(b=>b.classList.toggle('on',b===el));break;
  case 'a-max':A.max=Math.max(1,Math.min(10,A.max+Number(v)));$('#a-max').textContent=A.max;break;
  case 'a-next':askNext();break;
  case 'a-prev':A.step=Math.max(1,A.step-1);renderAsk(true);break;
  case 'a-consent':A.consent[v]=!A.consent[v];el.classList.toggle('on',A.consent[v]);el.classList.remove('err');el.setAttribute('aria-checked',A.consent[v]);break;
  case 'a-submit':askSubmit();break;
  case 'v-send':vSend(v);break;
  case 'v-check':vCheck(v);break;
  case 'v-change':S.verify[v+'Ok']=false;save();refreshVerify();break;
  case 'v-id':vIdentify();break;
  case 'v-done':vDone();break;
  case 'verify-open':openVerifySheet(null);break;
  case 'open-notifs':openNotifs();break;
  case 'notif-go':notifGo(id);break;
  case 'admin-t':S.admin=!S.admin;save();renderProfile();toast(S.admin?'Ylläpitäjätila päällä (demo) 🛡️':'Ylläpitäjätila pois');break;
  case 'open-admin':openAdmin();break;
  case 'adm-tab':adminTab=v;renderAdmin();break;
  case 'adm-approve':admApprove(id);break;
  case 'adm-reject':openReasonSheet(id,'reject');break;
  case 'adm-info':openReasonSheet(id,'info');break;
  case 'reason-preset':{const t=$('#reason-txt');if(t){t.value=v;t.classList.remove('err')}break}
  case 'reason-ok':reasonOk(id,v);break;
  case 'req-reply':openReplySheet(id);break;
  case 'req-reply-ok':replyOk(id);break;
  case 'qa':if(chatId)sendMessage(chatId,v);break;
  case 'hf-act':HF.act=v;renderHullut();break;
  case 'hf-lvl':HF.lvl=Number(v);renderHullut();break;
  case 'hullut-create':startCrazyCreate(v);break;
  case 'hullut-map':hullutMap();break;
  case 'cs-crazy':csCrazy=!csCrazy;if(csCrazy&&csEmoji==='✨'){csEmoji='🤪'}renderCsToggles();$$('.emoji-grid button').forEach(b=>b.classList.toggle('on',b.dataset.v===csEmoji));break;
  case 'cs-adult':csAdult=!csAdult;csAdultTouched=true;renderCsToggles();break;
  case 'c-crazy-t':if(!cEff().lockC){C.crazyUser=!C.crazyUser;renderCreateCrazy();if(pickMarker)pickMarker.setIcon(createPin())}break;
  case 'c-adult-t':if(!cEff().lockA){C.adultUser=!C.adultUser;renderCreateCrazy();if(pickMarker)pickMarker.setIcon(createPin())}break;
  case 'c-clvl':C.clvl=Number(v);renderCreateCrazy();break;
  case 'join':join(id,el);break;
  case 'leave':leave(id);break;
  case 'delete':delMeetup(id);break;
  case 'f-act':F.act=v;onFilterChange();break;
  case 'f-time':F.time=v;onFilterChange();break;
  case 'f-clear':F.act='all';F.time='all';F.district='all';F.level='all';onFilterChange();break;
  case 'onb-next':onbNext();break;
  case 'pick-act':pick.has(v)?pick.delete(v):pick.add(v);renderLajit();break;
  case 'lajit-back':if(lajitMode==='onb'){$$('.push').forEach(p=>p.classList.remove('active'));$('#app').classList.remove('pushed');renderOnb()}else closePush();break;
  case 'lajit-done':lajitDone();break;
  case 'edit-favs':openLajit('edit');break;
  case 'add-own':openSheet(el.dataset.ctx,el.dataset.crazy==='1');break;
  case 'sheet-close':closeSheet();break;
  case 'cs-emoji':csEmoji=v;$$('.emoji-grid button').forEach(b=>b.classList.toggle('on',b===el));$('#cs-emoji-own').value='';csPrev();break;
  case 'cs-add':csAdd();break;
  case 'c-act':C.act=v;renderCreateActs();renderCreateCrazy();updTitlePh();if(pickMarker)pickMarker.setIcon(createPin());break;
  case 'c-level':C.level=v;$$('#c-levels button').forEach(b=>b.classList.toggle('on',b===el));break;
  case 'c-max':C.max=Math.max(2,Math.min(50,C.max+Number(v)));$('#c-max').textContent=C.max;break;
  case 'publish':publish();break;
  case 'locate':locate();break;
  case 'mc-close':selectMarker(null);break;
  case 'ftoggle':mapCollapsed=!mapCollapsed;renderMapFilters();break;
  case 'show-on-map':{const mid=id;go('map');setTimeout(()=>{if(!bigMap)return;const m=byId(mid);if(!m)return;if(!markers[mid]){F.act='all';F.time='all';F.district='all';F.level='all';renderMapAll(false)}if(markers[mid]){bigMap.setView([m.lat,m.lng],15,{animate:false});bigMap._fitted=true;selectMarker(mid,true)}},150);break}
  case 'mine-seg':mineSeg=v;renderMine();break;
  case 'save-profile':saveProfile();break;
  case 'reset-all':if(confirm('Nollataanko kaikki tiedot? Omat tapahtumat, lajit ja viestit poistetaan.')){localStorage.removeItem(LS_KEY);localStorage.removeItem(OLD_LS_KEY);location.reload()}break;
 }
});
document.addEventListener('change',e=>{const el=e.target;if(el.matches('select[data-f]')){F[el.dataset.f]=el.value;onFilterChange()}if(el.id==='gf-district'){GF.district=el.value;renderGood()}if(el.id==='a-district'&&A){A.district=el.value;askDistrictMoved()}});
document.addEventListener('submit',e=>{e.preventDefault();if(e.target.dataset.form==='chat-full'){const i=$('#cv-in');if(chatId&&i){sendMessage(chatId,i.value);i.value='';i.focus({preventScroll:true})}}});
document.addEventListener('input',e=>{if(e.target.id==='chat-q'){chatQ=e.target.value;renderChatList();return}goodInput(e.target);if(e.target.classList&&e.target.classList.contains('err'))e.target.classList.remove('err')});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if($('#app').classList.contains('sheet-open'))closeSheet();else if($('#app').classList.contains('pushed')&&S.onboarded)goBack()}});

/* ================= INIT ================= */
if(!S.onboarded){$('#app').classList.add('onb');$('#onb').classList.add('active');renderOnb();renderNav()}
else{$('#app').classList.remove('onb');resetCreate();go('home')}
window.__molaplan={get state(){return S},get crazyUpcoming(){return crazyUpcoming().map(m=>m.id)},get unreadTotal(){return totalUnread()},get approvedHelps(){return approvedHelps().map(h=>h.id)},get demoCodes(){return Object.assign({},VT.codes)}};
})();
</script>
